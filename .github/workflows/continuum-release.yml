name: Continuum release
on:
  push:
    branches: [release/windows-preview-2]
  workflow_dispatch:
permissions:
  contents: read
env:
  VERSION: 0.2.0-preview.2
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: ./.github/actions/setup-ci-deps
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - run: vp run --filter @t3tools/desktop ensure:electron
      - shell: bash
        run: node scripts/update-release-package-versions.ts "$VERSION"
      - name: Build Windows x64 installer
        shell: bash
        env:
          T3CODE_DESKTOP_UPDATE_REPOSITORY: SwashX-dev/continuum-ide
          T3CODE_TELEMETRY_CHANNEL: dev
        run: vp run dist:desktop:artifact --platform win --target nsis --arch x64 --build-version "$VERSION" --verbose
      - name: Install and launch the packaged app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'ContinuumInstall'
          $env:T3CODE_HOME = Join-Path $env:RUNNER_TEMP 'continuum-windows-smoke'
          $installer = Resolve-Path 'release/Continuum-IDE-Setup-x64.exe'
          $setup = Start-Process $installer.Path -ArgumentList '/S', "/D=$target" -PassThru -Wait
          if ($setup.ExitCode -ne 0) { throw "NSIS exited with code $($setup.ExitCode)" }
          $app = Get-ChildItem $target -Filter 'Continuum IDE*.exe' -File | Select-Object -First 1
          if (!$app) { throw 'Continuum executable missing after Windows installation' }
          $process = Start-Process $app.FullName -ArgumentList '--remote-debugging-port=9224' -PassThru
          try {
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) { throw "Continuum exited with code $($process.ExitCode)" }
              try {
                $pages = Invoke-RestMethod 'http://127.0.0.1:9224/json/list' -TimeoutSec 2
                if ($pages | Where-Object { $_.type -eq 'page' -and $_.title -like '*Continuum*' }) { exit 0 }
              } catch {}
              Start-Sleep -Seconds 1
            }
            throw 'Packaged Continuum renderer did not become ready'
          } finally {
            if (!$process.HasExited) { Stop-Process -Id $process.Id }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: continuum-win-x64
          path: |
            release/Continuum-IDE-Setup-x64.exe
            release/Continuum-IDE-Setup-x64.exe.blockmap
            release/latest.yml
          if-no-files-found: error
  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: continuum-win-x64
          path: dist
      - name: Publish the verified installer and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          grep -Fq Continuum-IDE-Setup-x64.exe dist/latest.yml
          (cd dist && sha256sum -- Continuum-IDE-Setup-x64.exe Continuum-IDE-Setup-x64.exe.blockmap latest.yml > SHA256SUMS)
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --prerelease --title "Continuum IDE $VERSION for Windows" --notes 'Windows x64 preview of the Continuum game development update. Download Continuum-IDE-Setup-x64.exe to install. The installer is unsigned. SHA256SUMS lists the asset checksums.'
